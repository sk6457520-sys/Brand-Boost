<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brands Promotion</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #07152f, #101a35, #32165c);
      color: white;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: auto;
      padding: 45px 0;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      margin: 20px 0 35px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .intro {
      font-size: 21px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    .logo-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 28px;
      margin: 10px 0 15px;
    }

    .card p {
      font-size: 18px;
      line-height: 1.6;
      color: #e5e7eb;
    }

    .next-btn {
      display: block;
      margin-top: 30px;
      padding: 17px;
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      color: white;
      text-decoration: none;
      border-radius: 15px;
      font-size: 21px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(109,40,217,0.35);
    }

    .next-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>BRANDS PROMOTION</h1>

    <div class="card">

      <div class="logo-icon">📢</div>

      <h2>LOGO PROMOTION</h2>

      <p>
        अगर आपको ब्रांड्स का लोगो प्रमोशन करना है
तो नीचे दिए गए NEXT पर टैब करें।
      </p>

      <a class="next-btn" href="platform.html">
        NEXT →
      </a>

    </div>

  </div>

</body>
</html>
