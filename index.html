<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Logo Promotion Platforms</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #243b72 0%, transparent 40%),
        radial-gradient(circle at bottom right, #5b2c83 0%, transparent 40%),
        #080d1c;
      color: white;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 35px 10px 30px;
    }

    .header h1 {
      font-size: 27px;
      line-height: 1.5;
    }

    .platform-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .icon {
      width: 62px;
      height: 62px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      flex-shrink: 0;
    }

    .icon svg {
      width: 38px;
      height: 38px;
    }

    .platform-name {
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #bfc7ff;
      text-decoration: none;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>
        आप किस प्लेटफॉर्म पर<br>
        लोगो का प्रमोशन करना चाहते हैं?
      </h1>
    </div>

    <!-- Instagram -->
    <div class="platform-card">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"
                fill="none" stroke="#d62976" stroke-width="2"/>
          <circle cx="12" cy="12" r="4"
                  fill="none" stroke="#d62976" stroke-width="2"/>
          <circle cx="17.5" cy="6.5" r="1.2" fill="#d62976"/>
        </svg>
      </div>
      <div class="platform-name">INSTAGRAM</div>
    </div>

    <!-- YouTube -->
    <div class="platform-card">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <rect x="2.5" y="5" width="19" height="14" rx="4"
                fill="#ff0000"/>
          <polygon points="10,8.5 10,15.5 16,12"
                   fill="white"/>
        </svg>
      </div>
      <div class="platform-name">YOUTUBE</div>
    </div>

    <!-- Facebook -->
    <div class="platform-card">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="#1877f2"/>
          <path d="M13.5 20v-7h2.3l.4-2.7h-2.7V8.6
                   c0-.8.2-1.4 1.4-1.4h1.5V4.8
                   c-.3 0-.9-.1-1.8-.1
                   -2.1 0-3.5 1.3-3.5 3.6v2H9v2.7h2.1v7h2.4z"
                fill="white"/>
        </svg>
      </div>
      <div class="platform-name">FACEBOOK</div>
    </div>

    <a href="index.html" class="back">
      ← वापस जाएँ
    </a>

  </div>

</body>
</html>
