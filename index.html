<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PromoHub</title>

<!-- Social Media Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #312e81,
        #1e3a8a,
        #0f766e
    );
}

.page {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;
}

.box {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

h1 {
    font-size: 32px;
    line-height: 1.2;
    margin-bottom: 45px;
}

h2 {
    font-size: 30px;
    margin-bottom: 22px;
}

.question {
    font-size: 19px;
    line-height: 1.5;
    margin-bottom: 30px;
}

/* Main buttons */

.main-button {
    width: 100%;
    border: none;
    border-radius: 18px;

    padding: 21px 20px;
    margin: 12px 0;

    color: white;
    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.25);

    transition: transform 0.2s;
}

.main-button:active {
    transform: scale(0.97);
}

.story-button {
    background: linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );
}

.logo-button {
    background: linear-gradient(
        135deg,
        #059669,
        #10b981
    );
}

/* Platform buttons */

.platform {
    width: 100%;

    display: flex;
    align-items: center;

    text-align: left;

    background: rgba(255,255,255,0.97);
    color: #111827;

    border: none;
    border-radius: 18px;

    padding: 18px 22px;
    margin: 15px 0;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 9px 22px rgba(0,0,0,0.25);

    transition: transform 0.2s;
}

.platform:active {
    transform: scale(0.97);
}

/* Social media icons */

.platform-icon {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 20px;

    font-size: 30px;
}

/* Instagram */

.instagram-icon {
    color: #E1306C;
}

/* YouTube */

.youtube-icon {
    color: #FF0000;
}

/* Facebook */

.facebook-icon {
    color: #1877F2;
}

/* Back button */

.back {
    margin-top: 25px;

    padding: 12px 28px;

    background: rgba(255,255,255,0.08);

    color: white;

    border: 1px solid rgba(255,255,255,0.55);

    border-radius: 12px;

    font-size: 17px;

    cursor: pointer;
}

.hidden {
    display: none;
}

</style>
</head>

<body>


<!-- ========================= -->
<!-- HOME PAGE -->
<!-- ========================= -->

<div class="page" id="home">

    <div class="box">

        <h1>
            Welcome to Our<br>
            Promotion Platform
        </h1>

        <div class="question">
            Aap kya promote karna chahte hain?
        </div>


        <button
            class="main-button story-button"
            onclick="showPage('storyPage')">

            Story Promotion

        </button>


        <button
            class="main-button logo-button"
            onclick="showPage('logoPage')">

            Logo Promotion

        </button>

    </div>

</div>



<!-- ========================= -->
<!-- STORY PROMOTION PAGE -->
<!-- ========================= -->

<div class="page hidden" id="storyPage">

    <div class="box">

        <h2>
            Story Promotion
        </h2>

        <div class="question">
            Aap kis platform par story promotion
            karna chahte hain?
        </div>


        <!-- Instagram -->

        <button class="platform">

            <span class="platform-icon instagram-icon">
                <i class="fa-brands fa-instagram"></i>
            </span>

            Instagram

        </button>


        <!-- YouTube -->

        <button class="platform">

            <span class="platform-icon youtube-icon">
                <i class="fa-brands fa-youtube"></i>
            </span>

            YouTube

        </button>


        <!-- Facebook -->

        <button class="platform">

            <span class="platform-icon facebook-icon">
                <i class="fa-brands fa-facebook"></i>
            </span>

            Facebook

        </button>


        <button
            class="back"
            onclick="showPage('home')">

            ← Back

        </button>

    </div>

</div>



<!-- ========================= -->
<!-- LOGO PROMOTION PAGE -->
<!-- ========================= -->

<div class="page hidden" id="logoPage">

    <div class="box">

        <h2>
            Logo Promotion
        </h2>

        <div class="question">
            Aap kis platform par logo promotion
            karna chahte hain?
        </div>


        <!-- Instagram -->

        <button class="platform">

            <span class="platform-icon instagram-icon">
                <i class="fa-brands fa-instagram"></i>
            </span>

            Instagram

        </button>


        <!-- YouTube -->

        <button class="platform">

            <span class="platform-icon youtube-icon">
                <i class="fa-brands fa-youtube"></i>
            </span>

            YouTube

        </button>


        <!-- Facebook -->

        <button class="platform">

            <span class="platform-icon facebook-icon">
                <i class="fa-brands fa-facebook"></i>
            </span>

            Facebook

        </button>


        <button
            class="back"
            onclick="showPage('home')">

            ← Back

        </button>

    </div>

</div>



<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script>

function showPage(pageId) {

    document
        .getElementById("home")
        .classList.add("hidden");

    document
        .getElementById("storyPage")
        .classList.add("hidden");

    document
        .getElementById("logoPage")
        .classList.add("hidden");


    document
        .getElementById(pageId)
        .classList.remove("hidden");

}

</script>

</body>
</html>
