<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PromoHub</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111827, #312e81, #0f766e);
  color: white;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 45px 20px;
  text-align: center;
}

h1 {
  font-size: 34px;
  margin-bottom: 18px;
}

.subtitle {
  font-size: 20px;
  line-height: 1.5;
  margin-bottom: 32px;
}

.brand-card {
  width: 100%;
  height: 105px;
  margin-bottom: 18px;
  padding: 15px 20px;

  display: flex;
  align-items: center;

  background: white;
  color: #111827;

  border: none;
  border-radius: 18px;

  box-shadow: 0 8px 20px rgba(0,0,0,0.25);

  cursor: pointer;
}

.brand-card:active {
  transform: scale(0.97);
}

.logo-box {
  width: 75px;
  height: 75px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;
}

.logo-box img {
  width: 70px;
  height: 70px;
  object-fit: contain;
  border-radius: 10px;
}

.brand-name {
  flex: 1;
  text-align: left;
  padding-left: 20px;
  font-size: 23px;
  font-weight: bold;
}

/* BACK BUTTON */

.back {
  margin-top: 20px;
  padding: 14px 35px;

  background: transparent;
  color: white;

  border: 2px solid rgba(255,255,255,0.7);
  border-radius: 14px;

  font-size: 18px;
  cursor: pointer;
}

.back:active {
  transform: scale(0.96);
}
</style>
</head>

<body>

<div class="container">

  <h1>Brand Promotion</h1>

  <div class="subtitle">
    Aap kis brand par promotion<br>
    karna chahte hain?
  </div>


  <button class="brand-card" onclick="selectBrand('Brand One')">

    <div class="logo-box">
      <img src="brand1.jpeg" alt="Brand One">
    </div>

    <div class="brand-name">
      Brand One
    </div>

  </button>


  <button class="brand-card" onclick="selectBrand('Brand Two')">

    <div class="logo-box">
      <img src="brand2.jpeg" alt="Brand Two">
    </div>

    <div class="brand-name">
      Brand Two
    </div>

  </button>


  <button class="brand-card" onclick="selectBrand('Brand Three')">

    <div class="logo-box">
      <img src="brand3.jpeg" alt="Brand Three">
    </div>

    <div class="brand-name">
      Brand Three
    </div>

  </button>


  <button class="brand-card" onclick="selectBrand('Brand Four')">

    <div class="logo-box">
      <img src="brand4.jpeg" alt="Brand Four">
    </div>

    <div class="brand-name">
      Brand Four
    </div>

  </button>


  <button class="back" onclick="goBack()">
    ← Back
  </button>

</div>


<script>

function selectBrand(brand) {
  alert("Aapne " + brand + " select kiya hai.");
}

function goBack() {
  window.history.back();
}

</script>

</body>
</html>
