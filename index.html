<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PromoHub</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #111827, #1e3a8a, #075985);
  color: white;
}

.container {
  width: 100%;
  max-width: 500px;
  margin: auto;
  padding: 45px 20px 35px;
  text-align: center;
}

h1 {
  font-size: 38px;
  margin-bottom: 18px;
}

.subtitle {
  font-size: 21px;
  line-height: 1.5;
  margin-bottom: 35px;
}

.brand-card {
  width: 100%;
  height: 105px;
  background: white;
  color: #111827;
  border-radius: 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  padding: 15px 20px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  transition: transform 0.2s;
}

.brand-card:active {
  transform: scale(0.97);
}

.logo-box {
  width: 75px;
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.logo-box img {
  width: 70px;
  height: 70px;
  object-fit: contain;
  border-radius: 10px;
}

.brand-name {
  flex: 1;
  text-align: left;
  font-size: 25px;
  font-weight: bold;
  padding-left: 18px;
}

.back {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 35px;
  border: 2px solid rgba(255,255,255,0.6);
  border-radius: 15px;
  color: white;
  text-decoration: none;
  font-size: 19px;
}

@media (max-width: 400px) {
  h1 {
    font-size: 32px;
  }

  .subtitle {
    font-size: 19px;
  }

  .brand-card {
    height: 95px;
  }

  .logo-box,
  .logo-box img {
    width: 65px;
    height: 65px;
  }

  .brand-name {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>Story Promotion</h1>

  <div class="subtitle">
    Aap kis brand par story promotion<br>
    karna chahte hain?
  </div>

  <!-- 4Rabet -->
  <div class="brand-card" onclick="selectBrand('4Rabet')">
    <div class="logo-box">
      <img src="4rabet_logo.jpeg" alt="4Rabet">
    </div>
    <div class="brand-name">
      4Rabet
    </div>
  </div>

  <!-- Mostbet -->
  <div class="brand-card" onclick="selectBrand('Mostbet')">
    <div class="logo-box">
      <img src="images (1).jpeg" alt="Mostbet">
    </div>
    <div class="brand-name">
      Mostbet
    </div>
  </div>

  <!-- Raja Bets -->
  <div class="brand-card" onclick="selectBrand('Raja Bets')">
    <div class="logo-box">
      <img src="images (2).jpeg" alt="Raja Bets">
    </div>
    <div class="brand-name">
      Raja Bets
    </div>
  </div>

  <!-- Poker Club -->
  <div class="brand-card" onclick="selectBrand('Poker Club')">
    <div class="logo-box">
      <img src="images.jpeg" alt="Poker Club">
    </div>
    <div class="brand-name">
      Poker Club
    </div>
  </div>

  <a href="index.html" class="back">← Back</a>

</div>

<script>
function selectBrand(brand) {
  alert("Aapne " + brand + " select kiya hai.");
}
</script>

</body>
</html>
