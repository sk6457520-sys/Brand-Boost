<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brands Promotion</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #243b72 0%, transparent 40%),
        radial-gradient(circle at bottom right, #5b2c83 0%, transparent 40%),
        #080d1c;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .main-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 38px 25px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(15px);
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 34px;
      letter-spacing: 1px;
      margin-bottom: 22px;
    }

    .description {
      font-size: 18px;
      line-height: 1.7;
      color: #d9deeb;
      margin-bottom: 30px;
    }

    .promotion-box {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 25px 20px;
    }

    .promotion-box h2 {
      font-size: 25px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .next-button {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #6c63ff, #9b5cff);
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 10px 25px rgba(108, 99, 255, 0.30);
      transition: 0.2s;
    }

    .next-button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 25px;
      color: #8f99ad;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="main-card">

      <div class="badge">
        PROFESSIONAL BRAND SERVICES
      </div>

      <h1>BRANDS PROMOTION</h1>

      <p class="description">
        अगर आपको ब्रांड्स का लोगो प्रमोशन करना है,
        तो नीचे दिए गए लोगो प्रमोशन पर टैब करें।
      </p>

      <div class="promotion-box">

        <h2>LOGO PROMOTION</h2>

        <a href="logo.html" class="next-button">
          NEXT →
        </a>

      </div>

      <div class="footer">
        Professional Promotion Platform
      </div>

    </div>

  </div>

</body>
  </html>
