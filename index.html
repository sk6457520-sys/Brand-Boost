<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PromoHub</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed,
            #db2777,
            #f97316
        );

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
}

.container {
    width: 100%;
    max-width: 500px;
    padding: 30px 20px;
    text-align: center;
}

/* LOGO / TITLE */

.logo {
    font-size: 38px;
    font-weight: 800;
    margin-bottom: 12px;

    text-shadow:
        0 4px 15px rgba(0,0,0,0.25);
}

.welcome {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 12px;
}

.subtitle {
    font-size: 18px;
    margin-bottom: 32px;
    opacity: 0.95;
}

/* CARDS */

.option-card {
    width: 100%;
    min-height: 105px;

    border: none;
    border-radius: 22px;

    margin-bottom: 20px;

    display: flex;
    align-items: center;

    padding: 18px 22px;

    color: white;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);

    transition: 0.2s;
}

.option-card:active {
    transform: scale(0.96);
}

/* STORY */

.story {
    background:
        linear-gradient(
            135deg,
            #06b6d4,
            #2563eb
        );
}

/* LOGO */

.logo-card {
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #ec4899
        );
}

/* ICON */

.icon {
    width: 65px;
    height: 65px;

    border-radius: 18px;

    background: rgba(255,255,255,0.20);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;

    flex-shrink: 0;
}

/* TEXT */

.card-text {
    text-align: left;
    margin-left: 20px;
}

.card-title {
    font-size: 23px;
    font-weight: 700;
    margin-bottom: 5px;
}

.card-arrow {
    font-size: 15px;
    opacity: 0.85;
}

/* FOOTER */

.footer {
    margin-top: 25px;
    font-size: 13px;
    opacity: 0.75;
}

</style>
</head>


<body>

<div class="container">

    <div class="logo">
        PromoHub
    </div>

    <div class="welcome">
        Welcome to Our Promotion Platform
    </div>

    <div class="subtitle">
        Aap kya promote karna chahte hain?
    </div>


    <!-- STORY PROMOTION -->

    <button
        class="option-card story"
        onclick="storyPromotion()"
    >

        <div class="icon">
            📖
        </div>

        <div class="card-text">

            <div class="card-title">
                Story Promotion
            </div>

            <div class="card-arrow">
                Continue →
            </div>

        </div>

    </button>


    <!-- LOGO PROMOTION -->

    <button
        class="option-card logo-card"
        onclick="logoPromotion()"
    >

        <div class="icon">
            🎨
        </div>

        <div class="card-text">

            <div class="card-title">
                Logo Promotion
            </div>

            <div class="card-arrow">
                Continue →
            </div>

        </div>

    </button>


    <div class="footer">
        © 2026 PromoHub
    </div>

</div>


<script>

function storyPromotion() {

    alert("Story Promotion selected");

}


function logoPromotion() {

    alert("Logo Promotion selected");

}

</script>

</body>
</html>
