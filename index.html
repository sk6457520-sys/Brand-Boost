<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PromoHub</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* ================================
   BASIC
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed,
        #db2777,
        #f97316
    );

    color: white;

}


/* ================================
   PAGE SYSTEM
================================ */

.page {
    display: none;
}

.page.active {
    display: block;
}


/* ================================
   CONTAINER
================================ */

.container {

    width: 100%;

    max-width: 600px;

    margin: auto;

    padding: 25px 18px 40px;

}


/* ================================
   HOME PAGE
================================ */

.logo {

    text-align: center;

    font-size: 38px;

    font-weight: bold;

    margin-top: 25px;

    margin-bottom: 15px;

}

.welcome {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 12px;

}

.question {

    text-align: center;

    font-size: 18px;

    margin-bottom: 30px;

}


/* ================================
   HOME CARDS
================================ */

.home-card {

    width: 100%;

    border: none;

    border-radius: 20px;

    padding: 25px 20px;

    margin-bottom: 18px;

    cursor: pointer;

    font-size: 20px;

    font-weight: bold;

    color: white;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.20);

    transition: 0.25s;

}

.home-card:hover {
    transform: translateY(-3px);
}

.story-card {

    background:
    linear-gradient(
        135deg,
        #f59e0b,
        #ef4444
    );

}

.logo-card {

    background:
    linear-gradient(
        135deg,
        #06b6d4,
        #2563eb
    );

}

.home-icon {

    font-size: 28px;

    margin-right: 12px;

}


/* ================================
   PLATFORM PAGE
================================ */

.platform-title {

    text-align: center;

    font-size: 32px;

    font-weight: bold;

    margin-top: 20px;

    margin-bottom: 15px;

}

.platform-subtitle {

    text-align: center;

    font-size: 17px;

    margin-bottom: 30px;

}


/* ================================
   PLATFORM CARD
================================ */

.platform-card {

    width: 100%;

    display: flex;

    align-items: center;

    border: none;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 16px;

    cursor: pointer;

    color: white;

    font-size: 20px;

    font-weight: bold;

    box-shadow:
    0 8px 20px rgba(0,0,0,0.20);

    transition: 0.25s;

}

.platform-card:hover {

    transform: translateY(-3px);

}

.platform-icon {

    width: 55px;

    font-size: 32px;

    text-align: center;

}

.platform-name {

    flex: 1;

    text-align: left;

    padding-left: 15px;

}

.instagram {

    background:
    linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );

}

.youtube {

    background:
    linear-gradient(
        135deg,
        #ff0000,
        #cc0000
    );

}

.facebook {

    background:
    linear-gradient(
        135deg,
        #1877f2,
        #0d47a1
    );

}


/* ================================
   BRAND PAGE
================================ */

.brand-title {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    margin-top: 20px;

    margin-bottom: 10px;

}

.brand-subtitle {

    text-align: center;

    font-size: 17px;

    margin-bottom: 25px;

}


/* ================================
   BRAND CARD
================================ */

.brand-card {

    background:
    rgba(255,255,255,0.15);

    border:
    1px solid rgba(255,255,255,0.30);

    border-radius: 20px;

    padding: 22px;

    margin-bottom: 18px;

    text-align: center;

    backdrop-filter: blur(10px);

    box-shadow:
    0 10px 25px rgba(0,0,0,0.15);

}

.brand-image {
    width: 120px;
    height: 120px;
    margin: 0 auto;
    display: block;
    object-fit: contain;
    border-radius: 20px;
    background: white;
    padding: 10px;
    box-sizing: border-box;
}


}

.brand-name {

    font-size: 22px;

    font-weight: bold;

    margin-top: 15px;

}


/* ================================
   BUTTONS
================================ */

.next-button,
.brand-back-button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    font-size: 18px;

    font-weight: bold;

    margin-top: 12px;

    cursor: pointer;

}

.next-button {

    background: white;

    color: #2563eb;

}

.brand-back-button {

    background:
    rgba(255,255,255,0.20);

    color: white;

}


/* ================================
   MOBILE
================================ */

@media (max-width: 480px) {

    .logo {
        font-size: 34px;
    }

    .welcome {
        font-size: 20px;
    }

    .platform-title {
        font-size: 28px;
    }

    .brand-title {
        font-size: 27px;
    }

}


/* ================================
   END
================================ */

</style>

</head>


<body>


<!-- =================================================
     HOME PAGE
================================================= -->

<div id="homePage" class="page active">

    <div class="container">

        <div class="logo">
            PromoHub
        </div>

        <div class="welcome">
            Welcome to Our Promotion Platform
        </div>

        <div class="question">
            Aap kya promote karna chahte hain?
        </div>


        <!-- STORY -->

        <button
        class="home-card story-card"
        onclick="showPlatformPage()">

            <i class="fa-solid fa-book home-icon"></i>

            Story Promotion

        </button>


        <!-- LOGO -->

        <button
        class="home-card logo-card"
        onclick="showPlatformPage()">

            <i class="fa-solid fa-image home-icon"></i>

            Logo Promotion

        </button>

    </div>

</div>



<!-- =================================================
     PLATFORM PAGE
================================================= -->

<div id="platformPage" class="page">

    <div class="container">

        <div class="platform-title">
            Choose Platform
        </div>

        <div class="platform-subtitle">
            Aap kis platform par promotion karna chahte hain?
        </div>


        <!-- INSTAGRAM -->

        <button
        class="platform-card instagram"
        onclick="selectPlatform('Instagram')">

            <div class="platform-icon">

                <i class="fa-brands fa-instagram"></i>

            </div>

            <div class="platform-name">
                Instagram
            </div>

        </button>


        <!-- YOUTUBE -->

        <button
        class="platform-card youtube"
        onclick="selectPlatform('YouTube')">

            <div class="platform-icon">

                <i class="fa-brands fa-youtube"></i>

            </div>

            <div class="platform-name">
                YouTube
            </div>

        </button>


        <!-- FACEBOOK -->

        <button
        class="platform-card facebook"
        onclick="selectPlatform('Facebook')">

            <div class="platform-icon">

                <i class="fa-brands fa-facebook"></i>

            </div>

            <div class="platform-name">
                Facebook
            </div>

        </button>


        <!-- BACK -->

        <button
        class="brand-back-button"
        onclick="goHome()">

            ← Back

        </button>

    </div>

</div>



<!-- =================================================
     BRAND PAGE
================================================= -->

<div id="brandPage" class="page">

    <div class="container">

        <div class="brand-title"
             id="brandPageTitle">

            Instagram Brands

        </div>

        <div class="brand-subtitle">

            Select a brand for promotion

        </div>


        <!-- BRAND 1 -->

        <div class="brand-card">

            <div class="brand-image">
                B1
            </div>

            <div class="brand-name">
                Brand One
            </div>

        </div>


        <!-- BRAND 2 -->

        <div class="brand-card">

            <div class="brand-image">
                B2
            </div>

            <div class="brand-name">
                Brand Two
            </div>

        </div>


        <!-- BRAND 3 -->

        <div class="brand-card">

            <div class="brand-image">
                B3
            </div>

            <div class="brand-name">
                Brand Three
            </div>

        </div>


        <!-- BRAND 4 -->

        <div class="brand-card">

            <div class="brand-image">
                B4
            </div>

            <div class="brand-name">
                Brand Four
            </div>

        </div>


        <!-- NEXT -->

        <button
        class="next-button"
        onclick="nextPage()">

            Next →

        </button>


        <!-- BACK -->

        <button
        class="brand-back-button"
        onclick="backToPlatform()">

            ← Back

        </button>

    </div>

</div>



<!-- =================================================
     JAVASCRIPT
================================================= -->

<script>


/* ================================
   SHOW PLATFORM
================================ */

function showPlatformPage() {

    document
    .getElementById("homePage")
    .classList
    .remove("active");

    document
    .getElementById("brandPage")
    .classList
    .remove("active");

    document
    .getElementById("platformPage")
    .classList
    .add("active");

}


/* ================================
   HOME
================================ */

function goHome() {

    document
    .getElementById("platformPage")
    .classList
    .remove("active");

    document
    .getElementById("brandPage")
    .classList
    .remove("active");

    document
    .getElementById("homePage")
    .classList
    .add("active");

}


/* ================================
   SELECT PLATFORM
================================ */

function selectPlatform(platform) {

    document
    .getElementById("platformPage")
    .classList
    .remove("active");

    document
    .getElementById("brandPage")
    .classList
    .add("active");


    document
    .getElementById("brandPageTitle")
    .innerText = platform + " Brands";

}


/* ================================
   BACK TO PLATFORM
================================ */

function backToPlatform() {

    document
    .getElementById("brandPage")
    .classList
    .remove("active");

    document
    .getElementById("platformPage")
    .classList
    .add("active");

}


/* ================================
   NEXT
================================ */

function nextPage() {

    alert("Next page coming soon!");

}


</script>


</body>

      </html>
