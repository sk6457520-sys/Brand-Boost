<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brand Promotion</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f8;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #4b25c5, #7440df);
      color: white;
      text-align: center;
      padding: 35px 20px;
      border-radius: 0 0 25px 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 25px auto;
    }

    .promotion-card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      text-align: center;
      cursor: pointer;
    }

    .promotion-card h2 {
      color: #4b25c5;
      margin: 0 0 12px;
      font-size: 24px;
    }

    .promotion-card p {
      margin: 0;
      font-size: 17px;
      color: #555;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      background: #4b25c5;
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>BRAND PROMOTION</h1>
  </div>

  <div class="container">

    <div class="promotion-card"
         onclick="window.location.href='logo.html'">

      <h2>📢 Logo Promotion</h2>

      <p>
        Logo Promotion ke liye brands aur work details yahan dekhein.
      </p>

      <div class="button">
        View Brands
      </div>

    </div>

  </div>

</body>
</html>
