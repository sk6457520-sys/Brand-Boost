<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Logo Promotion Brands</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #315bea, #c52bc5);
      color: white;
    }

    .header {
      text-align: center;
      padding: 40px 20px 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      font-size: 18px;
      margin-top: 12px;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 10px auto 30px;
    }

    .brand-card {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 20px;
      text-align: center;
    }

    .brand-card h2 {
      margin: 0;
      font-size: 24px;
    }

    .brand-card p {
      font-size: 16px;
      margin-bottom: 0;
    }

    .back {
      display: block;
      text-align: center;
      background: rgba(255,255,255,0.20);
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Logo Promotion</h1>
    <p>Select a brand for promotion</p>
  </div>

  <div class="container">

    <div class="brand-card">
      <h2>Brand One</h2>
      <p>Brand details will be added later.</p>
    </div>

    <div class="brand-card">
      <h2>Brand Two</h2>
      <p>Brand details will be added later.</p>
    </div>

    <div class="brand-card">
      <h2>Brand Three</h2>
      <p>Brand details will be added later.</p>
    </div>

    <a class="back" href="index.html">
      ← Back
    </a>

  </div>

</body>
</html>
