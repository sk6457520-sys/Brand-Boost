  <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Logo Promotion</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f8;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #4b25c5, #7440df);
      color: white;
      text-align: center;
      padding: 30px 18px;
      border-radius: 0 0 25px 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 22px auto;
    }

    .brand-card {
      background: white;
      padding: 15px;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    .brand-card img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }

    .brand-card h2 {
      margin: 14px 0 5px;
      color: #4b25c5;
      font-size: 22px;
    }

    .brand-card p {
      margin: 5px 0;
      color: #666;
      font-size: 15px;
    }

    .back {
      display: block;
      text-align: center;
      background: #4b25c5;
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      margin: 22px 0;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>LOGO PROMOTION</h1>
  </div>

  <div class="container">

    <div class="brand-card">
      <img src="brand1.png" alt="Brand One">
      <h2>Brand One</h2>
      <p>Promotion details will be added later.</p>
    </div>

    <div class="brand-card">
      <img src="brand2.jpg" alt="Brand Two">
      <h2>Brand Two</h2>
      <p>Promotion details will be added later.</p>
    </div>

    <div class="brand-card">
      <img src="brand3.jpg" alt="Brand Three">
      <h2>Brand Three</h2>
      <p>Promotion details will be added later.</p>
    </div>

    <div class="brand-card">
      <img src="brand4.jpg" alt="Brand Four">
      <h2>Brand Four</h2>
      <p>Promotion details will be added later.</p>
    </div>

    <a class="back" href="index.html">
      ← Back
    </a>

  </div>

</body>
</html>
