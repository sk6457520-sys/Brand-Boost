<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brand Selection</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #243b72 0%, transparent 40%),
        radial-gradient(circle at bottom right, #5b2c83 0%, transparent 40%),
        #080d1c;
      color: white;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    .heading {
      text-align: center;
      margin: 20px 0 30px;
    }

    .heading h1 {
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .heading p {
      color: #cbd5e1;
      font-size: 17px;
    }

    .brand {
      display: block;
      width: 100%;
      margin-bottom: 20px;
      padding: 18px;

      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 20px;

      text-decoration: none;
      color: white;
      text-align: center;

      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .brand-image {
      width: 180px;
      height: 120px;

      object-fit: contain;

      display: block;
      margin: 0 auto 15px;

      background: white;
      border-radius: 15px;
      padding: 10px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .brand:active {
      transform: scale(0.98);
    }

    .back {
      display: block;
      margin-top: 30px;
      padding: 16px;

      background: #374151;
      color: white;
      text-decoration: none;

      text-align: center;
      border-radius: 14px;

      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="heading">
      <h1>
        आप किस ब्रांड का लोगो प्रमोट करना चाहते हैं?
      </h1>

      <p>
        ब्रांड पर टैब करें
      </p>
    </div>


    <!-- BRAND 1 -->

    <a href="#" class="brand">

      <img
        src="brand1.jpg"
        class="brand-image"
        alt="Brand 1"
      >

      <div class="brand-name">
        BRAND 1
      </div>

    </a>


    <!-- BRAND 2 -->

    <a href="#" class="brand">

      <img
        src="brand2.jpg"
        class="brand-image"
        alt="Brand 2"
      >

      <div class="brand-name">
        BRAND 2
      </div>

    </a>


    <!-- BRAND 3 -->

    <a href="#" class="brand">

      <img
        src="brand3.jpg"
        class="brand-image"
        alt="Brand 3"
      >

      <div class="brand-name">
        BRAND 3
      </div>

    </a>


    <!-- BRAND 4 -->

    <a href="#" class="brand">

      <img
        src="brand4.jpg"
        class="brand-image"
        alt="Brand 4"
      >

      <div class="brand-name">
        BRAND 4
      </div>

    </a>


    <!-- BACK BUTTON -->

    <a href="platform.html" class="back">
      ← BACK
    </a>

  </div>

</body>
  </html>
