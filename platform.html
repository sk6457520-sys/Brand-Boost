<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Platform Selection</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #243b72 0%, transparent 40%),
        radial-gradient(circle at bottom right, #5b2c83 0%, transparent 40%),
        #080d1c;
      color: white;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding-top: 25px;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 29px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .header p {
      color: #bfc7d9;
      font-size: 16px;
    }

    .platform {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      padding: 20px;
      margin-bottom: 18px;

      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 20px;

      color: white;
      text-decoration: none;

      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .icon {
      width: 68px;
      height: 68px;
      min-width: 68px;

      background: white;
      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 42px;
      height: 42px;
      display: block;
    }

    .platform-name {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .back {
      display: block;
      margin-top: 30px;
      padding: 16px;

      background: #374151;
      color: white;

      text-align: center;
      text-decoration: none;

      border-radius: 14px;

      font-size: 18px;
      font-weight: bold;
    }

    .platform:active,
    .back:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <h1>
        आप किस प्लेटफॉर्म पर<br>
        लोगो का प्रमोशन करना चाहते हैं?
      </h1>

      <p>
        नीचे अपना प्लेटफॉर्म चुनें
      </p>

    </div>


    <!-- INSTAGRAM -->

    <a href="brands.html" class="platform">

      <div class="icon">

        <svg viewBox="0 0 24 24">

          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="5"
            fill="none"
            stroke="#E1306C"
            stroke-width="2"
          />

          <circle
            cx="12"
            cy="12"
            r="4"
            fill="none"
            stroke="#E1306C"
            stroke-width="2"
          />

          <circle
            cx="17.5"
            cy="6.5"
            r="1.2"
            fill="#E1306C"
          />

        </svg>

      </div>

      <div class="platform-name">
        INSTAGRAM
      </div>

    </a>


    <!-- YOUTUBE -->

    <a href="brands.html" class="platform">

      <div class="icon">

        <svg viewBox="0 0 24 24">

          <rect
            x="2.5"
            y="5"
            width="19"
            height="14"
            rx="4"
            fill="#FF0000"
          />

          <polygon
            points="10,8.5 10,15.5 16,12"
            fill="white"
          />

        </svg>

      </div>

      <div class="platform-name">
        YOUTUBE
      </div>

    </a>


    <!-- FACEBOOK -->

    <a href="brands.html" class="platform">

      <div class="icon">

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="12"
            r="10"
            fill="#1877F2"
          />

          <path
            d="M13.5 20v-7h2.3l.4-2.7h-2.7V8.6
               c0-.8.2-1.4 1.4-1.4h1.5V4.8
               c-.3 0-.9-.1-1.8-.1
               -2.1 0-3.5 1.3-3.5 3.6v2H9v2.7h2.1v7h2.4z"
            fill="white"
          />

        </svg>

      </div>

      <div class="platform-name">
        FACEBOOK
      </div>

    </a>


    <!-- BACK BUTTON ONLY -->

    <a href="index.html" class="back">
      ← BACK
    </a>

  </div>

</body>
  </html>
